<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Hero</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="piano">
            <div class="key white" data-note="C"></div>
            <div class="key black" data-note="C#"></div>
            <div class="key white" data-note="D"></div>
            <div class="key black" data-note="D#"></div>
            <div class="key white" data-note="E"></div>
            <div class="key white" data-note="F"></div>
            <div class="key black" data-note="F#"></div>
            <div class="key white" data-note="G"></div>
            <div class="key black" data-note="G#"></div>
            <div class="key white" data-note="A"></div>
            <div class="key black" data-note="A#"></div>
            <div class="key white" data-note="B"></div>
        </div>
        <div id="ui">
            <div id="scores">
                <div id="score">Score: <span>0</span></div>
                <div id="high-score">Best: <span>0</span></div>
                <div id="last-score">Last: <span>0</span></div>
            </div>
            <div id="level-control">
                <span>Level:</span>
                <div id="level-selector"></div>
                <span id="level-name"></span>
            </div>
            <button id="start-btn">Start Game</button>
        </div>
        <div id="leaderboard">
            <h3>Leaderboard</h3>
            <div id="leaderboard-list"></div>
        </div>
    </div>

    <!-- Name input modal -->
    <div id="name-modal">
        <div class="modal-content">
            <h2>New High Score!</h2>
            <p class="final-score-display">Score: <span id="final-score">0</span></p>
            <input type="text" id="player-name-input" maxlength="20" placeholder="Enter your name...">
            <p class="hint">Leave empty for a random name</p>
            <button id="submit-score-btn">Submit Score</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
